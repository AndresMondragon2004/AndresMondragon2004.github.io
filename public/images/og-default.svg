<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Jesús Andrés - Portfolio</title>
  <desc id="desc">Preview social del portfolio de Jesús Andrés, desarrollador web y móvil.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="0.52" stop-color="#17122f"/>
      <stop offset="1" stop-color="#052f3a"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#06b6d4"/>
      <stop offset="0.55" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="22" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1040" cy="90" r="220" fill="#06b6d4" opacity="0.14" filter="url(#glow)"/>
  <circle cx="140" cy="560" r="240" fill="#8b5cf6" opacity="0.18" filter="url(#glow)"/>
  <path d="M90 485 C270 390 360 520 520 420 S790 210 1110 310" fill="none" stroke="url(#line)" stroke-width="6" opacity="0.9"/>
  <g fill="#ffffff" opacity="0.65">
    <circle cx="165" cy="446" r="7"/>
    <circle cx="340" cy="462" r="5"/>
    <circle cx="520" cy="420" r="8"/>
    <circle cx="720" cy="296" r="6"/>
    <circle cx="980" cy="292" r="7"/>
  </g>
  <rect x="80" y="76" width="1040" height="478" rx="28" fill="#020617" opacity="0.46" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="120" y="155" fill="#67e8f9" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800" letter-spacing="2">ANDRESDEV</text>
  <text x="120" y="260" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="78" font-weight="900">Jesús Andrés</text>
  <text x="120" y="338" fill="#e5e7eb" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="700">Desarrollo web, apps móviles y prototipos funcionales</text>
  <text x="120" y="430" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="600">React · Astro · Node.js · Interledger</text>
  <rect x="120" y="478" width="252" height="48" rx="12" fill="url(#line)"/>
  <text x="146" y="511" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800">Ver portfolio</text>
</svg>
